name: Forex signals

on:
  schedule:
    - cron: "5,35 * * * 1-5"   # 5 and 35 minutes past every hour, Mon-Fri (UTC)
  workflow_dispatch:
    inputs:
      test:
        description: "Only send a test message to Telegram"
        type: boolean
        default: false
      news_only:
        description: "Only post the news items (brief, alerts, headlines)"
        type: boolean
        default: false
      repost:
        description: "TEST: post news again even if already posted today (may duplicate)"
        type: boolean
        default: false
      test_chart:
        description: "TEST: post a sample chart image (clearly labelled as a test)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python signal_bot.py ${{ inputs.test && '--test' || (inputs.test_chart && '--test-chart' || inputs.repost && '--news-repost' || (inputs.news_only && '--news' || '')) }}

      - name: Save results
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add -A state
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Update signal state"
          for i in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            sleep 5
          done
          exit 1
