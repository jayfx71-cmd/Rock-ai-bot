name: scalp

on:
  schedule:
    - cron: '7,37 6-21 * * 1-5'
  workflow_dispatch:

concurrency:
  group: scalp
  cancel-in-progress: false

jobs:
  scalp:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: scalp-state-${{ github.run_id }}
          restore-keys: |
            scalp-state-

      - name: Run scalps
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCALP_CHAT_ID: ${{ secrets.SCALP_CHAT_ID }}
          TD_KEY: ${{ secrets.TD_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scalp_bot.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: scalp-state-${{ github.run_id }}
