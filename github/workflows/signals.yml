name: Forex signals

on:
  schedule:
    - cron: "5 * * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Only send a test message to Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python signal_bot.py ${{ inputs.test && '--test' || '' }}

      - name: Save results
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add state/signals.json
          git diff --staged --quiet || (git commit -m "Update signal state" && git push)
